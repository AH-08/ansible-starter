- name: Submit resolved JCL to z/OS
  hosts: zoslab
  gather_facts: false
  collections:
    - ibm.ibm_zos_core
  environment: "{{ environment_vars }}"
  vars:
    job_owner: IBMUSER
    vsam_name: IBMUSER.TEST02.KSDS

  tasks:
    - name: Create VSAM KSDS
      zos_data_set:
        name: "{{ vsam_name }}"
        type: ksds
        state: present
        record_format: fb
        record_length: 80
        space_primary: 2
        space_secondary: 2
        space_type: cyl
        key_length: 4
        key_offset: 0

    - name: Drop the contents of input dataset into output dataset using REPRO command.
      ibm.ibm_zos_core.zos_mvs_raw:
        pgm: idcams
        auth: true
        dds:
          - dd_data:
              dd_name: SYSIN
              content: |
                REPRO INFILE(INDD) OUTDATASET('"{{ vsam_name }}"')
          - dd_data:
              dd_name: INDD
              content: |
                0001TEST RECORD 1
                0002TEST RECORD 2
          - dd_output:
              dd_name: SYSPRINT
              return_content:
                type: text