---
- name: Submit resolved JCL to z/OS
  hosts: zoslab
  gather_facts: false
  environment: "{{ environment_vars }}"
  vars:
    job_owner: IBMUSER
    hlq: IBMUSER
    mlq: TEMP02
    libname: JCL 
    primary_allocation: 2
    secondary_allocation: 4 
    jcl_path: "{{ playbook_dir }}/templates/IDCAMS.jcl"
    jcl_dataset_name: "{{ job_owner }}.TEMP02.JCL"

  tasks:
    
    - name: Covert local JCL to IBM-1047 and submit
      zos_job_submit:
        src: "{{ playbook_dir }}/IDCAMS.jcl" 
        location: LOCAL
        encoding:
          from: UTF-8
          to: IBM-1047