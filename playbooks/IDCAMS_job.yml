---
- name: Submit resolved JCL to z/OS
  hosts: zoslab
  gather_facts: false
  collections:
    - ibm.ibm_zos_core
  environment: "{{ environment_vars }}"
  vars:
    job_owner: IBMUSER
    vsam_name: IBMUSER.TEST02.KSDS

  tasks:

    - name: Delete KSDS if exists
      zos_data_set:
        name: "{{ vsam_name }}"
        state: absent

    - name: Create KSDS
      zos_data_set:
        name: "{{ vsam_name }}"
        type: ksds
        state: present
        record_length: 80
        key_length: 4
        key_offset: 0

    - name: Check KSDS records
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/templates/KSDS_records.txt"
      delegate_to: localhost
      register: ksds_file

    - name: Show KSDS records file
      ansible.builtin.debug:
        var: ksds_file
    
    - name: Copy records to input sequential data set
      zos_copy:
        src: "{{ playbook_dir }}/templates/KSDS_records.txt"
        dest: "{{ vsam_name }}.INPUT"
        encoding:
          from: UTF-8
          to: IBM-1047

    - name: Load records into KSDS using IDCAMS REPRO
      zos_mvs_raw:
        program_name: IDCAMS
        auth: true
        dds:
          - dd_data_set:
              dd_name: INPUT
              data_set_name: "{{ vsam_name }}.INPUT"
              disposition: shr

          - dd_data_set:
              dd_name: OUTPUT
              data_set_name: "{{ vsam_name }}"
              disposition: shr

          - dd_input:
              dd_name: SYSIN
              content: |
                REPRO -
                  INFILE(INPUT) -
                  OUTFILE(OUTPUT)

          - dd_output:
              dd_name: SYSPRINT
              return_content:
                type: text

      register: load_ksds_result