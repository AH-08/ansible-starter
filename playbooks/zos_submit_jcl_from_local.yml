
- name: Hello World JCL job
  hosts: zoslab
  gather_facts: false
  collections:
    - ibm.ibm_zos_core
  environment: "{{ environment_vars }}"

  tasks:

  - name: Convert local JCL to IBM-1047 and submit the job.
    zos_job_submit:
      src: "{{ playbook_dir }}/IDCAMS.jcl" 
      location: LOCAL
      encoding:
        from: UTF-8
        to: IBM-1047