---
- name: Submit JCL member to z/OS
  hosts: zoslab
  gather_facts: false
  environment: "{{ environment_vars }}"
  vars:
    job_owner: IBMUSER
    hlq: PLAT01
    mlq: DEV
    libname: JCL 
    primary_allocation: 2
    secondary_allocation: 4 
    jcl_path: "{{ playbook_dir }}/tmp_jcl/rendered.jcl"
    jcl_dataset_name: "{{ job_owner }}.DEV.JCL"

  tasks:
    - name: Submit JCL in a PDSE member.
      ibm.ibm_zos_core.zos_job_submit:
        src: "{{ job_owner }}.DEV.JCL(HELLO)"
      register: job_result
    
    - name: Show job id
      ansible.builtin.debug:
        msg: "{{ job_result.jobs[0].job_id }}"
    
    - name: Show job ID and return code
      debug:
        msg: "Job {{ job_output.jobs[0].job_id }} completed RC={{ job_output.jobs[0].ret_code.msg }}"

    - name: Show spool output
      debug:
        msg: "{{ job_output.jobs[0].ddnames | map(attribute='content') | list }}"